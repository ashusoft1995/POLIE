services:
  - type: web
    name: hossana-police-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/hossana-police-backend-1.0.0.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-withered-hat-bdxdo3n4-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m"
