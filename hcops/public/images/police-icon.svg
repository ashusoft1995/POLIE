<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803D;stop-opacity:1" />
    </linearGradient>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield with shadow -->
  <g filter="url(#iconShadow)">
    <path d="M64 8 L16 24 L16 60 C16 92 40 116 64 124 C88 116 112 92 112 60 L112 24 Z" 
          fill="url(#iconGradient)" 
          stroke="#15803D" 
          stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(64, 60)">
    <circle cx="0" cy="0" r="28" fill="rgba(255,255,255,0.15)"/>
    <path d="M 0,-20 L 6,-6 L 21,-6 L 9,2 L 15,16 L 0,8 L -15,16 L -9,2 L -21,-6 L -6,-6 Z" 
          fill="#FCD34D" 
          stroke="#F59E0B" 
          stroke-width="1.5"/>
  </g>
  
  <!-- Top stripe -->
  <rect x="32" y="32" width="64" height="6" rx="2" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Bottom stripe -->
  <rect x="32" y="90" width="64" height="6" rx="2" fill="rgba(255,255,255,0.9)"/>
</svg>
