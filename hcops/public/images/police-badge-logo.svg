<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Government Police Badge - Navy Blue + Official Blue + Gold + White -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A72C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8910A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <g filter="url(#shadow)">
    <!-- Main shield shape - Police Navy -->
    <path d="M256 32 L96 96 L96 240 C96 368 176 464 256 496 C336 464 416 368 416 240 L416 96 Z" 
          fill="url(#shieldGradient)" 
          stroke="#1E3A8A" 
          stroke-width="4"/>
  </g>
  
  <!-- Inner shield border -->
  <path d="M256 56 L116 112 L116 240 C116 356 186 444 256 472 C326 444 396 356 396 240 L396 112 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="2"/>
  
  <!-- Center star - Official Gold -->
  <g transform="translate(256, 220)">
    <!-- Star background glow -->
    <circle cx="0" cy="0" r="85" fill="rgba(212,167,44,0.15)"/>
    
    <!-- Main star -->
    <path d="M 0,-70 L 16,-20 L 70,-20 L 26,10 L 42,60 L 0,30 L -42,60 L -26,10 L -70,-20 L -16,-20 Z" 
          fill="url(#starGradient)" 
          stroke="#B8910A" 
          stroke-width="2"/>
    
    <!-- Star highlights -->
    <path d="M 0,-70 L 16,-20 L 70,-20 L 26,10 L 42,60 L 0,30 L -42,60 L -26,10 L -70,-20 L -16,-20 Z" 
          fill="rgba(255,255,255,0.25)" 
          stroke="none"/>
  </g>
  
  <!-- Top banner - White -->
  <g transform="translate(256, 100)">
    <rect x="-100" y="-18" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">
      HOSSANA
    </text>
  </g>
  
  <!-- Bottom banner - White -->
  <g transform="translate(256, 360)">
    <rect x="-100" y="-18" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">
      POLICE
    </text>
  </g>
  
  <!-- Bottom text ribbon - Official Blue -->
  <g transform="translate(256, 420)">
    <rect x="-80" y="-12" width="160" height="24" rx="6" fill="#2563EB"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      CITY STATION
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="256" cy="220" r="95" fill="none" stroke="rgba(212,167,44,0.3)" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Side emblems - Gold -->
  <g transform="translate(150, 220)">
    <circle cx="0" cy="0" r="12" fill="rgba(212,167,44,0.3)"/>
    <path d="M 0,-8 L 3,0 L 0,8 L -3,0 Z" fill="#D4A72C"/>
  </g>
  <g transform="translate(362, 220)">
    <circle cx="0" cy="0" r="12" fill="rgba(212,167,44,0.3)"/>
    <path d="M 0,-8 L 3,0 L 0,8 L -3,0 Z" fill="#D4A72C"/>
  </g>
  
  <!-- Official stripe (top) - Blue, White, Gold -->
  <g transform="translate(256, 60)">
    <rect x="-60" y="0" width="40" height="8" fill="#1E3A8A" rx="2"/>
    <rect x="-20" y="0" width="40" height="8" fill="#FFFFFF" rx="2"/>
    <rect x="20" y="0" width="40" height="8" fill="#D4A72C" rx="2"/>
  </g>
</svg>
